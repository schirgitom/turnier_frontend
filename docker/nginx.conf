server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Authenticated API
  location /api/ {
    proxy_pass https://victora-api.schischos-lodge.com/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host victora-api.schischos-lodge.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public tournament API only. Keep /public/:id SPA routes on the frontend.
  location /public/tournaments/ {
    proxy_pass https://victora-api.schischos-lodge.com/public/tournaments/;
    proxy_ssl_server_name on;
    proxy_set_header Host victora-api.schischos-lodge.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SignalR / WebSocket hub
  location /hubs/ {
    proxy_pass https://victora-api.schischos-lodge.com/hubs/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host victora-api.schischos-lodge.com;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback for react-router routes.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional container health endpoint.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}

